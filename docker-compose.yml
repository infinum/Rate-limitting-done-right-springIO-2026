services:

  localstack:
    container_name: sms-localstack
    image: localstack/localstack:4.12.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ssm,sqs
      - DEBUG=0
    volumes:
      - type: bind
        source: ./init-localstack.sh
        target: /etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    container_name: sms-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5